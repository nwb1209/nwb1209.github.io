<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent使用记录</title>
    <style>
        body{font-family:system-ui;padding:20px;max-width:900px;margin:0 auto;background:#f5f7fa}
        .card{background:white;border-radius:12px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #00000015}
        .btn{padding:10px 18px;border:none;background:#2563eb;color:white;border-radius:8px;cursor:pointer;margin:5px}
        .btn:hover{background:#1d4ed8}
        .content{margin-top:15px;display:none}
        .active{display:block}
    </style>
</head>
<body>
    <h1>Agent使用记录</h1>
    <div class="card">
        <button class="btn" onclick="switchTab(0)">豆包</button>
        <button class="btn" onclick="switchTab(1)">ChatGPT</button>
        <button class="btn" onclick="switchTab(2)">文心一言</button>
        <div id="c0" class="content active">
            <h3>豆包</h3>
            <p>用途：线性代数解题、Python代码编写、网页开发、作业思路讲解</p>
            <p>效果：快速理解知识点，生成可运行代码，帮我调试GitHub Pages网页</p>
        </div>
        <div id="c1" class="content">
            <h3>ChatGPT</h3>
            <p>用途：英文资料阅读、算法原理深入理解</p>
            <p>效果：适合查阅外文相关AI资料，解释复杂模型原理</p>
        </div>
        <div id="c2" class="content">
            <h3>文心一言</h3>
            <p>用途：文案撰写、报告构思</p>
            <p>效果：快速生成课程报告框架，辅助整理作业文字说明</p>
        </div>
    </div>
<script>
function switchTab(idx){
    const all = document.querySelectorAll('.content');
    all.forEach(item=>item.classList.remove('active'))
    document.getElementById('c'+idx).classList.add('active')
}
</script>
</body>
</html>
