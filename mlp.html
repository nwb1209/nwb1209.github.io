<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MLP-XOR可视化</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:20px;max-width:1100px;margin:0 auto}
.box{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{border:1px solid #ccc;padding:10px;border-radius:8px}
canvas{width:100%;height:240px;background:#fafafa}
.ctrl{margin-bottom:12px}
input{width:100px;padding:4px;margin:0 6px}
button{padding:6px 14px;background:#2b78e4;color:#fff;border:none;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<div class="ctrl">
  实验说明：XOR异或 | 2输入-4隐藏-1输出 | Sigmoid | SGD | MSE<br>
  学习率 lr: <input id="lr" value="0.5">
  迭代轮数 epoch: <input id="epoch" value="3000">
  <button onclick="startTrain()">开始训练</button>
</div>

<div class="box">
  <div class="card">
    <div>Loss曲线</div>
    <canvas id="lossCanvas"></canvas>
  </div>
  <div class="card">
    <div>决策边界</div>
    <canvas id="boundCanvas"></canvas>
  </div>
  <div class="card">
    <div>权重W1热力图（输入→隐藏）</div>
    <canvas id="w1Canvas"></canvas>
  </div>
  <div class="card">
    <div>权重W2热力图（隐藏→输出）</div>
    <canvas id="w2Canvas"></canvas>
  </div>
</div>

<script>
// 数据集 XOR
const X = [[0,0],[0,1],[1,0],[1,1]]
const Y = [0,1,1,0]

// 网络 2-4-1
let W1, b1, W2, b2
let lossList = []
const h = 4

// 激活
function sigmoid(x){
  return 1/(1+Math.exp(-x))
}
function dsigmoid(y){
  return y*(1-y)
}

// 初始化权重
function initWeight(){
  W1 = Array(2).fill().map(()=>Array(h).fill().map(()=>Math.random()*2-1))
  b1 = Array(h).fill().map(()=>Math.random()*2-1)
  W2 = Array(h).fill().map(()=>Array(1).fill().map(()=>Math.random()*2-1))
  b2 = [Math.random()*2-1]
  lossList = []
}

// 前向
function forward(x){
  let z1 = [
    x[0]*W1[0][0]+x[1]*W1[1][0]+b1[0],
    x[0]*W1[0][1]+x[1]*W1[1][1]+b1[1],
    x[0]*W1[0][2]+x[1]*W1[1][2]+b1[2],
    x[0]*W1[0][3]+x[1]*W1[1][3]+b1[3]
  ]
  let a1 = z1.map(sigmoid)
  let z2 = a1[0]*W2[0][0]+a1[1]*W2[1][0]+a1[2]*W2[2][0]+a1[3]*W2[3][0]+b2[0]
  let a2 = sigmoid(z2)
  return {a1,a2}
}

// 训练
async function startTrain(){
  initWeight()
  const lr = Number(document.getElementById('lr').value)
  const epoch = Number(document.getElementById('epoch').value)

  for(let e=0;e<epoch;e++){
    let totalLoss = 0
    for(let i=0;i<4;i++){
      let x = X[i]
      let y = Y[i]
      let {a1,a2} = forward(x)
      let err = a2 - y
      totalLoss += err*err

      // 反向传播
      let d2 = err * dsigmoid(a2)
      // 更新 W2 b2
      for(let j=0;j<h;j++){
        W2[j][0] -= lr * d2 * a1[j]
      }
      b2[0] -= lr * d2

      // d1
      let d1 = []
      for(let j=0;j<h;j++){
        d1[j] = d2 * W2[j][0] * dsigmoid(a1[j])
      }
      // 更新 W1 b1
      W1[0][0] -= lr*d1[0]*x[0]
      W1[1][0] -= lr*d1[0]*x[1]
      W1[0][1] -= lr*d1[1]*x[0]
      W1[1][1] -= lr*d1[1]*x[1]
      W1[0][2] -= lr*d1[2]*x[0]
      W1[1][2] -= lr*d1[2]*x[1]
      W1[0][3] -= lr*d1[3]*x[0]
      W1[1][3] -= lr*d1[3]*x[1]

      b1[0] -= lr*d1[0]
      b1[1] -= lr*d1[1]
      b1[2] -= lr*d1[2]
      b1[3] -= lr*d1[3]
    }
    lossList.push(totalLoss/4)

    if(e%100===0){
      drawLoss()
      drawBoundary()
      drawW1()
      drawW2()
      await sleep(10)
    }
  }
  drawLoss()
  drawBoundary()
  drawW1()
  drawW2()
}

function sleep(t){return new Promise(r=>setTimeout(r,t))}

// 画loss
function drawLoss(){
  const c = document.getElementById('lossCanvas')
  const ctx = c.getContext('2d')
  c.width = c.offsetWidth
  c.height = c.offsetHeight
  ctx.clearRect(0,0,c.width,c.height)
  ctx.beginPath()
  ctx.strokeStyle="#2b78e4"
  for(let i=0;i<lossList.length;i++){
    let x = i/lossList.length * c.width
    let y = c.height - lossList[i]*c.height
    if(i===0) ctx.moveTo(x,y)
    else ctx.lineTo(x,y)
  }
  ctx.stroke()
}

// 决策边界
function drawBoundary(){
  const c = document.getElementById('boundCanvas')
  const ctx = c.getContext('2d')
  c.width = c.offsetWidth
  c.height = c.offsetHeight
  ctx.clearRect(0,0,c.width,c.height)
  const step = 6
  for(let px=0;px<c.width;px+=step){
    for(let py=0;py<c.height;py+=step){
      let x = px/c.width
      let y = py/c.height
      let out = forward([x,y]).a2
      ctx.fillStyle = `rgb(${out*255},${out*255},255)`
      ctx.fillRect(px,py,step,step)
    }
  }
  // 样本点
  ctx.fillStyle="#f00"
  for(let i=0;i<4;i++){
    let sx = X[i][0]*c.width
    let sy = X[i][1]*c.height
    ctx.beginPath()
    ctx.arc(sx,sy,5,0,Math.PI*2)
    ctx.fill()
  }
}

// W1热力图 2行4列
function drawW1(){
  const
